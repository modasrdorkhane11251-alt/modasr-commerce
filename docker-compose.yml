version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: modasr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modasr_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-modasr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modasr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - modasr-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: modasr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - modasr-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modasr-backend
    environment:
      DATABASE_URL: postgresql://modasr:password@postgres:5432/modasr_commerce
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-encryption-key-base64-encoded}
      TELEGRAM_BOT_TOKEN_MAIN: ${TELEGRAM_BOT_TOKEN_MAIN:-}
      DEBUG: "false"
      ENVIRONMENT: "development"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - modasr-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: modasr-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - modasr-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: modasr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - modasr-network

  # Celery Worker (Background Jobs)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modasr-celery-worker
    command: celery -A app.workers worker -l info
    environment:
      DATABASE_URL: postgresql://modasr:password@postgres:5432/modasr_commerce
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - modasr-network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modasr-celery-beat
    command: celery -A app.workers beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DATABASE_URL: postgresql://modasr:password@postgres:5432/modasr_commerce
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - modasr-network

volumes:
  postgres_data:
  redis_data:

networks:
  modasr-network:
    driver: bridge
